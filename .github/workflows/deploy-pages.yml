name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - name: Build static site
        run: |
          if ! output="$(npx vite build --base=/teste-front-end/ 2>&1)"; then
            echo "$output"
            details="$(echo "$output" | tail -c 7000 | tr '\n' ' ')"
            echo "::error title=Vite build output::$details"
            exit 1
          fi
          echo "$output"
      - run: node scripts/prepare-static-catalog.mjs
        env:
          SITES_STATIC_CATALOG: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
